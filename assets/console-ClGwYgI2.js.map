
      // QWEN Arcade: render the cartridge shelf + a dropdown group from the
      // manifest built by scripts/build-qwen-arcade.mjs. Picking a cart goes
      // through the normal #cart <select> change path, so loading is unchanged.
      (async () => {
        let manifest;
        try {
          const res = await fetch('/examples/QWEN/arcade.json');
          if (!res.ok) return;
          manifest = await res.json();
        } catch {
          return; // no manifest: the shelf stays hidden
        }
        const games = Array.isArray(manifest.games) ? manifest.games : [];
        if (!games.length) return;
        const select = document.getElementById('cart');
        const shelf = document.getElementById('qa-shelf');
        document.getElementById('qa-tag').textContent = manifest.tagline || '';
        const link = document.getElementById('qa-link');
        if (manifest.article) link.href = manifest.article;
        else link.remove();

        const group = document.createElement('optgroup');
        group.label = '✦ QWEN Arcade (made by a local Qwen model)';
        for (const g of games) {
          const opt = document.createElement('option');
          opt.value = g.path;
          opt.textContent = '✦ ' + g.title;
          group.appendChild(opt);
        }
        const previous = select.value; // don't change the default cart
        select.insertBefore(group, select.firstChild);
        select.value = previous;

        const cards = new Map();
        const markActive = () => {
          for (const [path, card] of cards) card.classList.toggle('is-active', path === select.value);
        };
        for (const g of games) {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'qa-cart';
          card.setAttribute('role', 'listitem');
          card.title = g.description || g.title;
          const img = g.cover ? `<img class="qa-label" src="${g.cover}" alt="" loading="lazy">` : '<span class="qa-label"></span>';
          card.innerHTML = `${img}<span class="qa-ai">AI</span><span class="qa-title"></span><span class="qa-blurb"></span>`;
          card.querySelector('.qa-title').textContent = g.title;
          card.querySelector('.qa-blurb').textContent = g.blurb || '';
          card.addEventListener('click', () => {
            card.classList.remove('is-inserting');
            void card.offsetWidth; // restart the insert animation
            card.classList.add('is-inserting');
            select.value = g.path;
            select.dispatchEvent(new Event('change'));
            markActive();
            document.getElementById('screen')?.focus?.();
          });
          card.addEventListener('animationend', () => card.classList.remove('is-inserting'));
          cards.set(g.path, card);
          shelf.appendChild(card);
        }
        select.addEventListener('change', markActive);
        markActive();
        document.getElementById('qwen-arcade').hidden = false;

        // console.html?qwen=<id> (linked from the dashboard) starts that game.
        const wanted = new URLSearchParams(location.search).get('qwen');
        const pick = wanted && games.find((g) => g.id === wanted);
        if (pick) {
          const start = () => cards.get(pick.path)?.click();
          if (document.readyState === 'complete') start();
          else window.addEventListener('load', start, { once: true });
          cards.get(pick.path)?.scrollIntoView({ block: 'nearest', inline: 'center' });
        }
      })();
