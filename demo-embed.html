<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova64 — Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #040309; }
    /* Full-bleed, responsive canvas. NOTE: we deliberately do NOT inject a
       ?w=/?h= param — that would lock main.js into fixed-size mode and stop
       it from filling/resizing. Leaving them out keeps the ResizeObserver
       (responsive) path in src/main.js active so the cart covers the frame. */
    canvas { display: block; width: 100%; height: 100%; }
    #nova64-fullscreen-btn { display: none !important; }

    /* ── Portrait gate: on phones held in portrait, pause + ask to rotate ── */
    .rotate-gate {
      position: fixed; inset: 0; z-index: 50; display: none;
      align-items: center; justify-content: center; text-align: center; padding: 28px;
      background: #040309; color: #ece9f4;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    .rotate-gate.is-on { display: flex; }
    .rotate-inner { display: flex; flex-direction: column; align-items: center; gap: 22px; max-width: 300px; }
    .rotate-glyph { position: relative; width: 120px; height: 120px; color: #5cd9ff; }
    .rotate-arrow { position: absolute; inset: 0; width: 120px; height: 120px; opacity: .85; }
    .rotate-phone {
      position: absolute; left: 50%; top: 50%; width: 42px; height: 72px; margin: -36px 0 0 -21px;
      border: 3px solid #5cd9ff; border-radius: 9px; box-shadow: 0 0 18px rgba(92, 217, 255, .4);
      animation: rotate-hint 2.6s cubic-bezier(.4, 0, .2, 1) infinite;
    }
    .rotate-phone::after {
      content: ''; position: absolute; left: 50%; bottom: 6px; width: 14px; height: 2px;
      margin-left: -7px; background: #5cd9ff; border-radius: 2px; opacity: .7;
    }
    @keyframes rotate-hint {
      0%, 12% { transform: rotate(0deg); }
      46%, 72% { transform: rotate(90deg); }
      100% { transform: rotate(0deg); }
    }
    .rotate-title { font-size: 18px; font-weight: 600; letter-spacing: .02em; line-height: 1.35; }
    .rotate-sub { font-size: 13px; color: #8a85a3; letter-spacing: .04em; }
    @media (prefers-reduced-motion: reduce) { .rotate-phone { animation: none; transform: rotate(90deg); } }
  </style>
  <script>
    // Pass through ?demo= (and an optional clearColor) but never w/h.
    (function () {
      var qs = new URLSearchParams(window.location.search);
      var changed = false;
      if (!qs.has('clearColor')) { qs.set('clearColor', '0x040309'); changed = true; }
      if (!qs.has('demo') && !qs.has('cart')) { qs.set('demo', 'hello-3d'); changed = true; }
      // This campaign cart has direct tap targets; a virtual gamepad would
      // cover its invitation buttons inside the compact homepage modal.
      if (qs.get('demo') === 'the-last-save-file') window.NOVA64_TOUCH_CONTROLS = false;
      if (changed) window.history.replaceState(null, '', '?' + qs.toString());
    })();
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.182.0",
      "three/tsl": "https://esm.sh/three@0.182.0/tsl",
      "three/webgpu": "https://esm.sh/three@0.182.0/webgpu",
      "three/examples/jsm/": "https://esm.sh/three@0.182.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" crossorigin src="./assets/studio-protocol-CIJHjwTp.js"></script>
  <script type="module" crossorigin src="./assets/main-efZ0HqUZ.js"></script>
  <!-- Vercel Web Analytics -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <canvas id="screen"></canvas>

  <!-- Portrait gate — shown on touch devices held in portrait. Pauses the cart. -->
  <div id="rotate-gate" class="rotate-gate" role="alertdialog" aria-label="Rotate your device" aria-hidden="true">
    <div class="rotate-inner">
      <div class="rotate-glyph" aria-hidden="true">
        <span class="rotate-phone"></span>
        <svg class="rotate-arrow" viewBox="0 0 120 120">
          <path d="M99 60a39 39 0 1 0-11.4 27.6" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>
          <path d="M84 94l3.6-19.5L103 86z" fill="currentColor"/>
        </svg>
      </div>
      <p class="rotate-title">Please view in landscape mode</p>
      <p class="rotate-sub">Rotate your device to play</p>
    </div>
  </div>

  <script>
    // Portrait gate: on a touch device held in portrait, show the rotate prompt
    // and PAUSE the cart loop (via the hook in src/main.js). Resume in landscape.
    (function () {
      var gate = document.getElementById('rotate-gate');
      if (!gate || !window.matchMedia) return;
      // Touch devices only — never gate a narrow desktop window.
      var mql = window.matchMedia('(orientation: portrait) and (pointer: coarse)');
      var wantPause = false;
      function syncPause() {
        if (typeof window.__nova64SetPaused === 'function') window.__nova64SetPaused(wantPause);
      }
      function apply() {
        var portrait = mql.matches;
        gate.classList.toggle('is-on', portrait);
        gate.setAttribute('aria-hidden', portrait ? 'false' : 'true');
        wantPause = portrait;
        syncPause();
      }
      if (mql.addEventListener) mql.addEventListener('change', apply);
      else if (mql.addListener) mql.addListener(apply);
      window.addEventListener('orientationchange', apply);
      window.addEventListener('resize', apply);
      // src/main.js loads as a deferred module, so the pause hook may not exist
      // on first paint — retry binding it for a few seconds.
      var tries = 0;
      var iv = setInterval(function () {
        if (typeof window.__nova64SetPaused === 'function' || ++tries > 60) {
          clearInterval(iv);
          syncPause();
        }
      }, 100);
      apply();
    })();
  </script>


</body>
</html>
